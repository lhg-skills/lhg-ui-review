<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">网页 UI 专家走查 — 截图 / 代码 / 链接三输入，五支柱系统找缺点</title>
  <desc id="desc">截图 / 代码 / 链接三种输入，五支柱系统找缺点，P0–P2 分级 + 百分制评分，每条意见按「观察 → 影响 → 修复」输出可执行指导。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="14" fill="#FDF2F8"/>
  <rect x="1" y="1" width="1198" height="358" rx="14" fill="none" stroke="#FBCFE8" stroke-width="1.5"/>

  <g id="title-block">
    <rect x="64" y="62" width="12" height="12" fill="#4F46E5"/>
    <text class="mono" x="86" y="74" font-size="17" letter-spacing="2" fill="#6B7280">网页 UI 走查 · SKILL</text>
    <text class="sans" x="64" y="152" font-size="72" font-weight="700" fill="#1F2937">UI 走查</text>
    <text class="sans" x="64" y="196" font-size="26" font-weight="700" fill="#BE185D">五支柱找缺点，P0–P2 分级</text>
    <text class="sans" x="64" y="238" font-size="21" fill="#1F2937">每条意见「观察 → 影响 → 修复」，先肯定优点。</text>
  </g>

  <line x1="700" y1="56" x2="700" y2="256" stroke="#FBCFE8" stroke-width="1.5"/>

  <g id="proof">
    <text class="sans" x="740" y="74" font-size="17" fill="#6B7280">走查的三个硬指标</text>
    <text class="mono" x="740" y="118" font-size="20" font-weight="700" fill="#4F46E5">五支柱</text>
    <text class="sans" x="814" y="118" font-size="22" font-weight="700" fill="#1F2937">可用性 → 文案</text>
    <text class="mono" x="740" y="164" font-size="20" font-weight="700" fill="#4F46E5">P0–P2</text>
    <text class="sans" x="809" y="164" font-size="22" font-weight="700" fill="#1F2937">分级 + 百分制</text>
    <text class="mono" x="740" y="210" font-size="20" font-weight="700" fill="#4F46E5">三件套</text>
    <text class="sans" x="814" y="210" font-size="22" font-weight="700" fill="#1F2937">观察 → 影响 → 修复</text>
  </g>

  <line x1="64" y1="288" x2="1136" y2="288" stroke="#FBCFE8" stroke-width="1.5"/>
  <g id="install">
    <text class="mono" x="64" y="327" font-size="16" fill="#6B7280">安装</text>
    <text class="mono" x="140" y="327" font-size="20" font-weight="700" fill="#BE185D">npx skills add lhg-skills/lhg-ui-review</text>
  </g>
</svg>
